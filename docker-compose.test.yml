name: job-tracker-test
services:
  postgres:
    image: postgres:16
    container_name: job_tracker_test_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: job_tracker_test
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - test_pgdata:/var/lib/postgresql/data

volumes:
  test_pgdata: